name: Dependabot Auto-Approve & Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Approve, wait for checks, and merge (minor/patch only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Auto-approved: ${{ steps.meta.outputs.update-type }}"
          for i in $(seq 1 30); do
            gh pr checks "$PR_NUMBER" --repo "$REPO" >/dev/null 2>&1 && break
            sleep 10
          done
          gh pr checks "$PR_NUMBER" --repo "$REPO" --watch
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch

      - name: Comment on major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "Skipping auto-merge: major update requires manual review."
